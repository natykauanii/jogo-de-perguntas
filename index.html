<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta do Conhecimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎡 Roleta do Conhecimento</h1>
        <div class="placar">
            <span>❤️ Vidas: <b id="vidas">3</b></span>
            <span>⭐ Pontos: <b id="pontos">0</b></span>
        </div>
    </header>

    <main class="container">
        <div class="roleta-box">
            <div class="seta">▼</div>
            <div class="roleta" id="roleta" onclick="girar()">
                <div class="fatia f1"><span>História</span></div>
                <div class="fatia f2"><span>Ciências</span></div>
                <div class="fatia f3"><span>Geografia</span></div>
                <div class="fatia f4"><span>Português</span></div>
                <div class="fatia f5"><span>Cultura Pop</span></div>
                <div class="fatia f6"><span>Bônus x2</span></div>
                <div class="miolo">GIRAR</div>
            </div>
            <button id="btn-girar" onclick="girar()">🎲 GIRAR ROLETA</button>
        </div>

        <div class="pergunta-box">
            <span class="tag" id="tema">Clique na roleta para começar!</span>
            <h2 id="pergunta">Aperte o botão ou clique direto na roleta colorida ao lado.</h2>
            <div id="opcoes" class="opcoes"></div>
            <p id="mensagem" class="mensagem"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
